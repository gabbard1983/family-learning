<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Learning</title>
<link rel="icon" href="ladybug/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ef;--card:#fff;--ink:#1f2a44;--soft:#6b7488;--shadow:0 4px 0 rgba(31,42,68,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#141a2b;--card:#1e263b;--ink:#f3efe6;--soft:#a7aec0;--shadow:0 4px 0 rgba(0,0,0,.35)}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;padding:24px 16px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:32px}
a.app{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
a.app img{width:72px;height:72px;border-radius:18px}
a.app b{font-size:24px;display:block}
a.app span{color:var(--soft);font-size:16px}
.soon{opacity:.6}
</style></head><body><main>
<h1>Family Learning</h1>
<a class="app" href="ladybug/"><img src="ladybug/icon-192.png" alt=""><div><b>Ladybug Lab</b><span>2nd grade · reading, math, and games</span></div></a>
<div class="app soon" style="display:flex;gap:16px;align-items:center;background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow)"><div style="width:72px;height:72px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:40px">📘</div><div><b style="font-size:24px;display:block">4th Grade</b><span style="color:var(--soft)">Coming soon</span></div></div>
</main></body></html>
